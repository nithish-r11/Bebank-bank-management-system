<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Transfer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
font-family:Segoe UI;
padding-bottom:110px;
}

.card{
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* 🔔 POPUP */
.toast-box{
position: fixed;
top: 20px;
right: 20px;
padding: 12px 18px;
color: white;
border-radius: 8px;
z-index: 9999;
opacity: 0;
transform: translateY(-20px);
transition: 0.4s;
}

.toast-box.show{
opacity: 1;
transform: translateY(0);
}

.toast-success{ background:#28a745; }
.toast-error{ background:#dc3545; }


</style>
</head>

<body>

<div class="container mt-5">

<div class="card p-4">
<h5 class="mb-3">Fund Transfer</h5>

<form method="post">
{% csrf_token %}
<input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">

<div class="mb-3">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <label class="fw-semibold mb-0">Select Beneficiary</label>
    <a href="{% url 'beneficiary_list' %}" class="small text-decoration-none">Manage Beneficiaries &rarr;</a>
  </div>
  <select name="beneficiary_id" id="beneficiarySelect" class="form-select">
    <option value="">-- Choose Saved Beneficiary or Enter Manually --</option>
    {% for b in beneficiaries %}
      <option value="{{ b.id }}" data-account-number="{{ b.account.account_number }}" {% if selected_beneficiary_id == b.id|stringformat:"s" %}selected{% endif %} {% if not b.is_available %}disabled{% endif %}>
        {{ b.nickname|default:b.account_holder_name }} ({{ b.masked_account_number }}){% if not b.is_available %} [Unavailable]{% endif %}
      </option>
    {% endfor %}
  </select>
</div>

<label class="mb-1 fw-semibold">Receiver Account Number</label>
<input type="text" name="account_number" id="accountNumberInput" class="form-control mb-3" placeholder="Receiver Account Number" required>

<label class="mb-1 fw-semibold">Amount (₹)</label>
<input type="number" step="0.01" min="1" name="amount" class="form-control mb-3" placeholder="Enter amount" required>

<button class="btn btn-success w-100">
Transfer Money
</button>

</form>

</div>

</div>

<!-- 🔔 POPUP MESSAGE -->
{% if messages %}
{% for message in messages %}

<div class="toast-box show 
{% if message.tags == 'error' %}toast-error{% else %}toast-success{% endif %}">
{{ message }}
</div>

{% endfor %}

<script>
setTimeout(()=>{
document.querySelectorAll(".toast-box").forEach(e=>{
e.classList.remove("show");
});
},3000);
</script>
{% endif %}

<!-- Bottom Navigation Component -->
{% include "includes/customer_bottom_nav.html" with active_tab="transfer" %}

<script>
document.addEventListener("DOMContentLoaded", function() {
    const bSelect = document.getElementById('beneficiarySelect');
    const accInput = document.getElementById('accountNumberInput');
    if (bSelect && accInput) {
        bSelect.addEventListener('change', function() {
            const selectedOpt = this.options[this.selectedIndex];
            if (selectedOpt && selectedOpt.dataset.accountNumber) {
                accInput.value = selectedOpt.dataset.accountNumber;
            } else if (!this.value) {
                accInput.value = '';
            }
        });
        if (bSelect.selectedIndex > 0) {
            const selectedOpt = bSelect.options[bSelect.selectedIndex];
            if (selectedOpt && selectedOpt.dataset.accountNumber && !accInput.value) {
                accInput.value = selectedOpt.dataset.accountNumber;
            }
        }
    }
});
</script>

{% include "includes/submit_guard.html" %}

</body>
</html>
