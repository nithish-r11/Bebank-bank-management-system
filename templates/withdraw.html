<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdraw</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
font-family:Segoe UI;
padding-bottom:110px;
}

.card{
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* 🔔 TOAST POPUP */
.toast-box{
position: fixed;
top: 20px;
right: 20px;
padding: 12px 18px;
color: white;
border-radius: 8px;
z-index: 9999;
opacity: 0;
transform: translateY(-20px);
transition: 0.4s;
}

.toast-box.show{
opacity: 1;
transform: translateY(0);
}

.toast-success{ background:#28a745; }
.toast-error{ background:#dc3545; }


</style>
</head>

<body>

<div class="container mt-5">

<div class="card p-4">

<h5 class="mb-3">Withdraw Money</h5>

<!-- 💰 BALANCE -->
<p class="text-muted">
<b>Available Balance:</b> ₹ {{ account.balance|default:"0" }}
</p>

<form method="post">
{% csrf_token %}
<input type="number" name="amount" class="form-control mb-3" placeholder="Enter amount" required>
<button class="btn btn-primary w-100">Withdraw</button>
</form>

</div>

</div>

<!-- 🔔 POPUP MESSAGE -->
{% if messages %}
<div id="toast" class="toast-box"></div>

<script>
const toast = document.getElementById("toast");

{% for message in messages %}
toast.innerText = "{{ message }}";
toast.classList.add("show");

{% if message.tags == 'error' %}
toast.classList.add("toast-error");
{% else %}
toast.classList.add("toast-success");
{% endif %}

setTimeout(()=>{
toast.classList.remove("show");
},3000);
{% endfor %}
</script>
{% endif %}

<!-- Bottom Navigation Component -->
{% include "includes/customer_bottom_nav.html" with active_tab="withdraw" %}

{% include "includes/submit_guard.html" %}

</body>
</html>
